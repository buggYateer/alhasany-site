name: نقل الصوت الجديد للـ Releases
# الداشبورد بترفع الصوت في incoming/<رقم الرسالة>.mp3 (القديمة) أو incoming/<رقم>.json فيه رابط Vercel Blob (الجديدة)
# هنا بيتنقل لـ Release audio-N ويتمسح من المستودع
on:
  push:
    branches: [main]
    paths: ["incoming/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: incoming, cancel-in-progress: false }
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: رفع الملفات على Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          moved=0
          mkdir -p /tmp/audio
          for f in incoming/*.json incoming/*.mp3; do
            id=$(basename "$f"); id=${id%.*}
            case "$id" in (*[!0-9_]*|'') echo "اسم غلط: $f"; continue;; esac
            src="$f"
            if [ "${f##*.}" = "json" ]; then
              url=$(jq -r .url "$f")
              case "$url" in (https://*.public.blob.vercel-storage.com/*) ;; (*) echo "رابط غلط في $f"; continue;; esac
              curl -fsSL "$url" -o "/tmp/audio/$id.mp3" || { echo "التحميل فشل: $f"; continue; }
              src="/tmp/audio/$id.mp3"
            fi
            num=${id%%_*}
            tag="audio-$((num / 500))"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "صوتيات $tag" --notes "ملفات صوت موقع مسجد الحسني"
            gh release upload "$tag" "$src" --clobber
            git rm -q "$f"
            moved=$((moved + 1))
          done
          if [ "$moved" -gt 0 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -qm "نقل $moved ملف صوت للـ Releases"
            git push
          fi
