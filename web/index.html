<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسجد الحَسَنِي</title>
<meta name="description" content="دروس وخطب وتلاوات مسجد الحسني — استمع من الموقع مباشرة">
<meta name="theme-color" content="#1e2a4a">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&icon_names=bedtime,close,forward_10,graphic_eq,keyboard_arrow_down,menu_book,mic,nights_stay,pause,play_arrow,replay_10,search,skip_next,skip_previous,tune,wb_twilight&display=block" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap">
  <button class="menu-btn" id="menuBtn" aria-label="القائمة" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <a class="brand" href="/"><img src="/logo.png" alt=""><span>مسجد الحسني</span></a>
  <nav class="nav" aria-label="الأقسام">
    <a href="/">الرئيسية</a>
    <a href="/weekly">دروس الأسبوع</a>
    <a href="/series">السلاسل</a>
    <a href="/khutab">خطب الجمعة</a>
    <a href="/latest">آخر المستجدات</a>
  </nav>
  <button class="search-btn" id="searchBtn" aria-label="بحث" aria-expanded="false" aria-controls="searchbar"><span class="ms">search</span></button>
  <a class="tg-btn" href="https://t.me/masjed_alhasany" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg>
    <span>قناة التليجرام</span>
  </a>
</div>
  <div class="searchbar" id="searchbar" hidden><div class="wrap"><div class="sbox"><span class="ms" aria-hidden="true">search</span><input id="gq" type="search" placeholder="ابحث باسم الدرس أو الشيخ أو السورة" aria-label="بحث" autocomplete="off" enterkeyhint="search"></div></div></div>
</header>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="القائمة" hidden>
  <div class="drawer-h"><b>القائمة</b><button class="x-btn" id="menuClose" aria-label="إغلاق القائمة"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button></div>
  <input class="search" id="drawerSearch" type="search" placeholder="ابحث عن درس أو شيخ" aria-label="بحث" autocomplete="off">
  <nav id="drawerNav"></nav>
</aside>

<main id="app" class="wrap" aria-live="polite"><p class="loading">جاري التحميل…</p></main>

<div class="player" id="player" hidden>
  <div class="pl-inner">
    <div class="pl-top"><button class="pl-min" id="plMin" hidden aria-label="تصغير المشغل"><span class="ms">keyboard_arrow_down</span></button><span>يُستمع الآن</span></div>
    <div class="pl-now">
      <img src="/logo.png" alt="" class="pl-art">
      <div class="pl-info"><div class="pl-title" id="plTitle"></div><div class="pl-sub" id="plSub"></div></div>
      <div class="pl-side">
        <div class="speed">
          <button class="pl-speed" id="plSpeed" aria-haspopup="menu" aria-expanded="false" aria-label="سرعة التشغيل">1×</button>
          <div class="speed-menu" id="speedMenu" role="menu" hidden></div>
        </div>
        <a class="pl-tg" id="plTg" target="_blank" rel="noopener" aria-label="افتح في تليجرام" title="افتح في تليجرام"><svg viewBox="0 0 24 24"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13.2l-4.8-1.5c-1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3z"/></svg></a>
        <button class="pl-close" id="plClose" aria-label="إيقاف وقفل المشغل"><span class="ms">close</span></button>
      </div>
    </div>
    <div class="pl-center" dir="ltr">
      <div class="pl-seekrow">
        <span id="plTime">0:00</span>
        <input type="range" id="plSeek" min="0" max="1000" value="0" aria-label="التقدم في الدرس">
        <span id="plDur">0:00</span>
      </div>
      <div class="pl-ctrls">
        <button class="pl-btn" id="plPrev" aria-label="الدرس السابق"><span class="ms">skip_previous</span></button>
        <button class="pl-btn" id="plBack" aria-label="رجوع 10 ثواني"><span class="ms">replay_10</span></button>
        <button class="pl-btn pl-main" id="plPlay" aria-label="تشغيل"><span class="ms" id="plIcon">play_arrow</span></button>
        <button class="pl-btn" id="plFwd" aria-label="تقديم 10 ثواني"><span class="ms">forward_10</span></button>
        <button class="pl-btn" id="plNext" aria-label="الدرس التالي"><span class="ms">skip_next</span></button>
      </div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script src="/app.js"></script>
</body>
</html>
